runtime: python311

env_variables:
  # Firestore-backed storage. Leave unset locally to keep using JSON files.
  DEV_MODE: "false"
  # SECRET_KEY and API keys live in .env — gitignored, but uploaded on deploy
  # and read by load_dotenv(). Never put secrets in this file: it is tracked
  # by git and published to GitHub.

handlers:
- url: /static
  static_dir: static

- url: /.*
  script: auto

automatic_scaling:
  min_instances: 0
  max_instances: 10
